<!DOCTYPE html>
<html lang="te">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Telugu Bible Slideshow</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #1c2230;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #c8a96e;
      --accent-hover: #dfbe7f;
      --verse-text: #ffffff;
      --ref-text: #c8a96e;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    body {
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #panel {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 10;
    }

    .panel-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .panel-row:last-child {
      margin-bottom: 0;
    }

    .panel-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      min-width: 44px;
    }

    select,
    input[type="number"] {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 7px 10px;
      outline: none;
      -webkit-appearance: none;
    }

    select:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
    }

    #book-select {
      flex: 1;
    }

    #chapter-input,
    #verse-input {
      width: 62px;
      text-align: center;
    }

    .btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 14px;
      transition: background 0.15s, opacity 0.15s, border-color 0.15s;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn:active {
      opacity: 0.7;
    }

    .btn-primary {
      background: var(--accent);
      color: #0d1117;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      border-color: rgba(255, 255, 255, 0.25);
    }

    .nav-btn {
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 500;
    }

    .font-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .font-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 16px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .font-btn:active {
      opacity: 0.6;
    }

    #font-size-label {
      font-size: 12px;
      color: var(--text-dim);
      min-width: 32px;
      text-align: center;
    }

    #slide {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 50px;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      min-height: 0;
      user-select: text;
    }

    /* Floating slide navigation buttons */
    .slide-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(22, 27, 34, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
      width: 44px;
      height: 72px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      backdrop-filter: blur(8px);
      z-index: 10;
      opacity: 0.25;
    }

    .slide-nav-btn:hover {
      opacity: 1;
      background: rgba(28, 34, 48, 0.9);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    }

    .slide-nav-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .slide-nav-btn.prev {
      left: 16px;
    }

    .slide-nav-btn.next {
      right: 16px;
    }

    @media (max-width: 600px) {
      #slide {
        padding: 20px 24px;
      }

      .slide-nav-btn {
        width: 36px;
        height: 52px;
        font-size: 22px;
        opacity: 0.5;
      }

      .slide-nav-btn.prev {
        left: 8px;
      }

      .slide-nav-btn.next {
        right: 8px;
      }
    }

    #verse-reference {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--ref-text);
      letter-spacing: 0.06em;
      margin-bottom: 24px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      transform: translateY(6px);
    }

    #verse-text {
      font-family: 'Noto Sans Telugu', sans-serif;
      font-size: 36px;
      font-weight: 600;
      color: var(--verse-text);
      line-height: 1.6;
      text-align: center;
      max-width: 950px;
      word-break: break-word;
      opacity: 0;
      transition: opacity 0.35s ease 0.05s, transform 0.35s ease 0.05s;
      transform: translateY(6px);
    }

    #verse-reference.show,
    #verse-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-dim);
      text-align: center;
    }

    #placeholder svg {
      opacity: 0.3;
    }

    #placeholder p {
      font-size: 14px;
      line-height: 1.5;
    }

    #loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--text-dim);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #error-msg {
      display: none;
      color: #f97583;
      font-size: 14px;
      text-align: center;
      padding: 0 20px;
      max-width: 500px;
      line-height: 1.5;
    }

    #toggle-panel {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      z-index: 20;
      display: none;
      backdrop-filter: blur(6px);
      transition: all 0.15s;
    }

    #toggle-panel:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    #keyboard-hint {
      position: absolute;
      bottom: 10px;
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0.35;
      pointer-events: none;
      letter-spacing: 0.04em;
      text-align: center;
    }

    #history {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 4px;
      scrollbar-width: none;
    }

    #history::-webkit-scrollbar {
      display: none;
    }

    .hist-pill {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 12px;
      padding: 3px 10px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }

    .hist-pill:hover,
    .hist-pill:active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .section-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <div id="panel">
    <div class="panel-row">
      <span class="panel-label">Book</span>
      <select id="book-select"></select>
      <button class="btn btn-secondary" id="fullscreen-btn" title="Toggle Fullscreen (F)"
        style="padding: 7px 11px; font-size: 15px;">⛶</button>
    </div>
    <div class="panel-row">
      <span class="panel-label">Ch / Vs</span>
      <input type="number" id="chapter-input" min="1" value="1" placeholder="Ch">
      <span style="color:var(--text-dim);font-size:14px">/</span>
      <input type="number" id="verse-input" min="1" value="1" placeholder="Vs">
      <button class="btn btn-secondary nav-btn" id="prev-btn" title="Previous Verse (← / PageUp)">‹ Prev</button>
      <button class="btn btn-primary" id="fetch-btn">Show</button>
      <button class="btn btn-secondary nav-btn" id="next-btn" title="Next Verse (→ / PageDown / Space)">Next ›</button>
    </div>
    <div class="panel-row" style="justify-content:space-between">
      <div>
        <div class="section-label">Font size</div>
        <div class="font-controls">
          <div class="font-btn" id="font-dec" title="Decrease Font Size">−</div>
          <span id="font-size-label">36</span>
          <div class="font-btn" id="font-inc" title="Increase Font Size">+</div>
        </div>
      </div>
      <div style="flex:1; margin-left:12px; min-width: 0;" id="history-wrap">
        <div class="section-label">Recent</div>
        <div id="history"></div>
      </div>
    </div>
  </div>

  <div id="slide">
    <button id="toggle-panel">☰ Show Controls</button>
    <button class="slide-nav-btn prev" id="slide-prev" title="Previous Verse (←)">‹</button>
    <button class="slide-nav-btn next" id="slide-next" title="Next Verse (→)">›</button>

    <div id="placeholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
      </svg>
      <p>Select a book, chapter &amp; verse<br>then tap <strong style="color:#c8a96e">Show</strong> or use <strong
          style="color:#c8a96e">‹ / ›</strong></p>
    </div>
    <div id="loading">
      <div class="spinner"></div>
      <span style="font-size:13px">వచనం లోడ్ అవుతోంది…</span>
    </div>
    <div id="error-msg"></div>
    <div id="verse-reference"></div>
    <div id="verse-text"></div>
    <div id="keyboard-hint">Shortcuts: ← / → Next &amp; Prev &bull; F Fullscreen &bull; C Controls</div>
  </div>

  <script>
    const BOOKS = [
      { id: "GEN", name: "ఆదికాండము", eng: "Genesis" },
      { id: "EXO", name: "నిర్గమకాండము", eng: "Exodus" },
      { id: "LEV", name: "లేవీయకాండము", eng: "Leviticus" },
      { id: "NUM", name: "సంఖ్యాకాండము", eng: "Numbers" },
      { id: "DEU", name: "ద్వితీయోపదేశకాండము", eng: "Deuteronomy" },
      { id: "JOS", name: "యెహోషువ", eng: "Joshua" },
      { id: "JDG", name: "న్యాయాధిపతులు", eng: "Judges" },
      { id: "RUT", name: "రూతు", eng: "Ruth" },
      { id: "1SA", name: "1 సమూయేలు", eng: "1 Samuel" },
      { id: "2SA", name: "2 సమూయేలు", eng: "2 Samuel" },
      { id: "1KI", name: "1 రాజులు", eng: "1 Kings" },
      { id: "2KI", name: "2 రాజులు", eng: "2 Kings" },
      { id: "1CH", name: "1 దినవృత్తాంతములు", eng: "1 Chronicles" },
      { id: "2CH", name: "2 దినవృత్తాంతములు", eng: "2 Chronicles" },
      { id: "EZR", name: "ఎజ్రా", eng: "Ezra" },
      { id: "NEH", name: "నెహెమ్యా", eng: "Nehemiah" },
      { id: "EST", name: "ఎస్తేరు", eng: "Esther" },
      { id: "JOB", name: "యోబు", eng: "Job" },
      { id: "PSA", name: "కీర్తనలు", eng: "Psalms" },
      { id: "PRO", name: "సామెతలు", eng: "Proverbs" },
      { id: "ECC", name: "ప్రసంగి", eng: "Ecclesiastes" },
      { id: "SNG", name: "పరమగీతము", eng: "Song of Solomon", file: "Song of Songs" },
      { id: "ISA", name: "యెషయా", eng: "Isaiah" },
      { id: "JER", name: "యిర్మీయా", eng: "Jeremiah" },
      { id: "LAM", name: "విలాపవాక్యములు", eng: "Lamentations" },
      { id: "EZK", name: "యెహెజ్కేలు", eng: "Ezekiel" },
      { id: "DAN", name: "దానియేలు", eng: "Daniel" },
      { id: "HOS", name: "హోషేయ", eng: "Hosea" },
      { id: "JOL", name: "యోవేలు", eng: "Joel" },
      { id: "AMO", name: "ఆమోసు", eng: "Amos" },
      { id: "OBA", name: "ఓబద్యా", eng: "Obadiah" },
      { id: "JON", name: "యోనా", eng: "Jonah" },
      { id: "MIC", name: "మీకా", eng: "Micah" },
      { id: "NAM", name: "నహూము", eng: "Nahum" },
      { id: "HAB", name: "హబక్కూకు", eng: "Habakkuk" },
      { id: "ZEP", name: "జెఫన్యా", eng: "Zephaniah" },
      { id: "HAG", name: "హగ్గయి", eng: "Haggai" },
      { id: "ZEC", name: "జెకర్యా", eng: "Zechariah" },
      { id: "MAL", name: "మలాకీ", eng: "Malachi" },
      { id: "MAT", name: "మత్తయి", eng: "Matthew" },
      { id: "MRK", name: "మార్కు", eng: "Mark" },
      { id: "LUK", name: "లూకా", eng: "Luke" },
      { id: "JHN", name: "యోహాను", eng: "John" },
      { id: "ACT", name: "అపొస్తలుల కార్యములు", eng: "Acts" },
      { id: "ROM", name: "రోమీయులకు", eng: "Romans" },
      { id: "1CO", name: "1 కొరింథీయులకు", eng: "1 Corinthians" },
      { id: "2CO", name: "2 కొరింథీయులకు", eng: "2 Corinthians" },
      { id: "GAL", name: "గలతీయులకు", eng: "Galatians" },
      { id: "EPH", name: "ఎఫెసీయులకు", eng: "Ephesians" },
      { id: "PHP", name: "ఫిలిప్పీయులకు", eng: "Philippians" },
      { id: "COL", name: "కొలొస్సయులకు", eng: "Colossians" },
      { id: "1TH", name: "1 థెస్సలొనీకయులకు", eng: "1 Thessalonians" },
      { id: "2TH", name: "2 థెస్సలొనీకయులకు", eng: "2 Thessalonians" },
      { id: "1TI", name: "1 తిమోతికి", eng: "1 Timothy" },
      { id: "2TI", name: "2 తిమోతికి", eng: "2 Timothy" },
      { id: "TIT", name: "తీతుకు", eng: "Titus" },
      { id: "PHM", name: "ఫిలేమోనుకు", eng: "Philemon" },
      { id: "HEB", name: "హెబ్రీయులకు", eng: "Hebrews" },
      { id: "JAS", name: "యాకోబు", eng: "James" },
      { id: "1PE", name: "1 పేతురు", eng: "1 Peter" },
      { id: "2PE", name: "2 పేతురు", eng: "2 Peter" },
      { id: "1JN", name: "1 యోహాను", eng: "1 John" },
      { id: "2JN", name: "2 యోహాను", eng: "2 John" },
      { id: "3JN", name: "3 యోహాను", eng: "3 John" },
      { id: "JUD", name: "యూదా", eng: "Jude" },
      { id: "REV", name: "ప్రకటన", eng: "Revelation" },
    ];

    // In-memory cache for loaded books to provide instantaneous navigation
    const bookCache = new Map();

    let fontSize = parseInt(localStorage.getItem('te-bible-font')) || 36;
    let history = [];
    let panelVisible = true;

    const bookSelect = document.getElementById('book-select');
    const chapterInput = document.getElementById('chapter-input');
    const verseInput = document.getElementById('verse-input');
    const fetchBtn = document.getElementById('fetch-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const slidePrevBtn = document.getElementById('slide-prev');
    const slideNextBtn = document.getElementById('slide-next');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const verseRef = document.getElementById('verse-reference');
    const verseText = document.getElementById('verse-text');
    const placeholder = document.getElementById('placeholder');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error-msg');
    const fontLabel = document.getElementById('font-size-label');
    const historyEl = document.getElementById('history');
    const togglePanel = document.getElementById('toggle-panel');
    const panel = document.getElementById('panel');

    // Populate books dropdown
    BOOKS.forEach((b, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${b.name} (${b.eng})`;
      bookSelect.appendChild(opt);
    });
    bookSelect.value = BOOKS.findIndex(b => b.id === 'MAT');

    // Font size controls
    function updateFontSize(n) {
      fontSize = Math.min(84, Math.max(18, n));
      fontLabel.textContent = fontSize;
      verseText.style.fontSize = fontSize + 'px';
      localStorage.setItem('te-bible-font', fontSize);
    }
    updateFontSize(fontSize);
    document.getElementById('font-dec').addEventListener('click', () => updateFontSize(fontSize - 2));
    document.getElementById('font-inc').addEventListener('click', () => updateFontSize(fontSize + 2));

    // Fullscreen toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => { });
      } else if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => { });
      }
    }
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Panel visibility toggle
    function setPanelVisibility(visible) {
      panelVisible = visible;
      panel.style.display = panelVisible ? '' : 'none';
      togglePanel.style.display = panelVisible ? 'none' : 'block';
    }

    // Double-tap or click on slide background to toggle panel
    let tapCount = 0;
    let tapTimer = null;
    document.getElementById('slide').addEventListener('click', e => {
      if (e.target.closest('button')) return;
      tapCount++;
      if (tapCount === 2) {
        clearTimeout(tapTimer);
        tapCount = 0;
        setPanelVisibility(!panelVisible);
        return;
      }
      tapTimer = setTimeout(() => { tapCount = 0; }, 350);
    });

    togglePanel.addEventListener('click', () => setPanelVisibility(true));

    // History management
    function addHistory(label, bookIdx, ch, vs) {
      history = history.filter(h => h.label !== label);
      history.unshift({ label, bookIdx, ch, vs });
      if (history.length > 8) history.pop();
      historyEl.innerHTML = '';
      history.forEach(h => {
        const pill = document.createElement('div');
        pill.className = 'hist-pill';
        pill.textContent = h.label;
        pill.addEventListener('click', () => {
          bookSelect.value = h.bookIdx;
          chapterInput.value = h.ch;
          verseInput.value = h.vs;
          fetchVerse();
        });
        historyEl.appendChild(pill);
      });
    }

    // State display management
    function showState(state) {
      placeholder.style.display = 'none';
      loadingEl.style.display = 'none';
      errorEl.style.display = 'none';
      verseRef.classList.remove('show');
      verseText.classList.remove('show');

      if (state === 'placeholder') placeholder.style.display = 'flex';
      if (state === 'loading') loadingEl.style.display = 'flex';
      if (state === 'error') errorEl.style.display = 'block';
      if (state === 'verse') {
        requestAnimationFrame(() => {
          verseRef.classList.add('show');
          verseText.classList.add('show');
        });
      }
    }

    // Load book data from open-source repository with CDN mirror fallback
    async function loadBookData(fileName) {
      if (bookCache.has(fileName)) {
        return bookCache.get(fileName);
      }

      const primaryUrl = `https://raw.githubusercontent.com/aruljohn/Bible-telugu/main/${encodeURIComponent(fileName)}.json`;
      const fallbackUrl = `https://cdn.jsdelivr.net/gh/aruljohn/Bible-telugu@main/${encodeURIComponent(fileName)}.json`;

      let response;
      try {
        response = await fetch(primaryUrl);
        if (!response.ok) throw new Error('Primary failed');
      } catch {
        response = await fetch(fallbackUrl);
      }

      if (!response || !response.ok) {
        throw new Error(`Failed to load ${fileName}`);
      }

      const data = await response.json();
      bookCache.set(fileName, data);
      return data;
    }

    // Fetch and display specific verse
    async function fetchVerse() {
      const bookIdx = parseInt(bookSelect.value);
      const book = BOOKS[bookIdx];
      const ch = parseInt(chapterInput.value) || 1;
      const vs = parseInt(verseInput.value) || 1;

      showState('loading');
      fetchBtn.disabled = true;

      try {
        const fileName = book.file || book.eng;
        const data = await loadBookData(fileName);

        chapterInput.max = data.chapters.length;

        const chapterObj = data.chapters.find(c => String(c.chapter) === String(ch));
        if (!chapterObj) {
          throw new Error(`అధ్యాయం ${ch} అందుబాటులో లేదు. (మొత్తం అధ్యాయాలు: ${data.chapters.length})`);
        }

        verseInput.max = chapterObj.verses.length;

        const verseObj = chapterObj.verses.find(v => String(v.verse) === String(vs));
        if (!verseObj || !verseObj.text) {
          throw new Error(`వచనం ${vs} అందుబాటులో లేదు. (మొత్తం వచనాలు: ${chapterObj.verses.length})`);
        }

        const teluguBookName = data.book?.telugu || book.name;
        const refLabel = `${teluguBookName} (${book.eng}) ${ch}:${vs}`;

        verseRef.textContent = refLabel;
        verseText.textContent = verseObj.text.trim();
        verseText.style.fontSize = fontSize + 'px';
        showState('verse');

        addHistory(`${book.name} ${ch}:${vs}`, bookIdx, ch, vs);

      } catch (err) {
        errorEl.textContent = err.message || 'వచనం కనుగొనబడలేదు. దయచేసి తనిఖీ చేసి మళ్ళీ ప్రయత్నించండి.';
        showState('error');
      } finally {
        fetchBtn.disabled = false;
      }
    }

    // Slide navigation (Next / Previous verse) across chapters and books
    async function changeVerse(delta) {
      let bookIdx = parseInt(bookSelect.value);
      let ch = parseInt(chapterInput.value) || 1;
      let vs = parseInt(verseInput.value) || 1;
      const book = BOOKS[bookIdx];
      const fileName = book.file || book.eng;

      try {
        const data = await loadBookData(fileName);
        const chapterObj = data.chapters.find(c => String(c.chapter) === String(ch));
        const totalVerses = chapterObj ? chapterObj.verses.length : 1;
        const totalChapters = data.chapters.length;

        if (delta > 0) {
          // Advance to next verse
          if (vs < totalVerses) {
            vs++;
          } else if (ch < totalChapters) {
            ch++;
            vs = 1;
          } else if (bookIdx < BOOKS.length - 1) {
            bookIdx++;
            ch = 1;
            vs = 1;
          } else {
            return; // Reached end of Revelation
          }
        } else if (delta < 0) {
          // Step back to previous verse
          if (vs > 1) {
            vs--;
          } else if (ch > 1) {
            ch--;
            const prevChap = data.chapters.find(c => String(c.chapter) === String(ch));
            vs = prevChap ? prevChap.verses.length : 1;
          } else if (bookIdx > 0) {
            bookIdx--;
            const prevBook = BOOKS[bookIdx];
            const prevData = await loadBookData(prevBook.file || prevBook.eng);
            ch = prevData.chapters.length;
            const lastChap = prevData.chapters[ch - 1];
            vs = lastChap ? lastChap.verses.length : 1;
          } else {
            return; // Reached beginning of Genesis
          }
        }

        bookSelect.value = bookIdx;
        chapterInput.value = ch;
        verseInput.value = vs;
        await fetchVerse();
      } catch (err) {
        console.error(err);
      }
    }

    // Event Listeners
    fetchBtn.addEventListener('click', fetchVerse);
    prevBtn.addEventListener('click', () => changeVerse(-1));
    nextBtn.addEventListener('click', () => changeVerse(1));
    slidePrevBtn.addEventListener('click', () => changeVerse(-1));
    slideNextBtn.addEventListener('click', () => changeVerse(1));

    // Update chapter / verse bounds when book changes
    bookSelect.addEventListener('change', async () => {
      chapterInput.value = 1;
      verseInput.value = 1;
      const book = BOOKS[parseInt(bookSelect.value)];
      try {
        const data = await loadBookData(book.file || book.eng);
        chapterInput.max = data.chapters.length;
        if (data.chapters[0]) {
          verseInput.max = data.chapters[0].verses.length;
        }
      } catch { }
    });

    // Update verse bounds when chapter changes
    chapterInput.addEventListener('change', async () => {
      const book = BOOKS[parseInt(bookSelect.value)];
      const ch = parseInt(chapterInput.value) || 1;
      try {
        const data = await loadBookData(book.file || book.eng);
        const chapterObj = data.chapters.find(c => String(c.chapter) === String(ch));
        if (chapterObj) {
          verseInput.max = chapterObj.verses.length;
        }
      } catch { }
    });

    [chapterInput, verseInput].forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') fetchVerse();
      });
    });

    // Keyboard presentation controls
    window.addEventListener('keydown', e => {
      const activeTag = document.activeElement ? document.activeElement.tagName : '';
      const isInputFocused = activeTag === 'INPUT' || activeTag === 'SELECT' || activeTag === 'TEXTAREA';

      if (e.key === 'ArrowRight' || e.key === 'PageDown' || (!isInputFocused && e.code === 'Space')) {
        e.preventDefault();
        changeVerse(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        changeVerse(-1);
      } else if (!isInputFocused && (e.key === 'f' || e.key === 'F')) {
        e.preventDefault();
        toggleFullscreen();
      } else if (!isInputFocused && (e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
        setPanelVisibility(!panelVisible);
      } else if (e.key === 'Escape' && !panelVisible) {
        setPanelVisibility(true);
      }
    });

    // Mobile touch swipe gestures on slide
    let touchStartX = 0;
    let touchStartY = 0;
    document.getElementById('slide').addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.getElementById('slide').addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // Detect horizontal swipe if delta X > 50px and predominantly horizontal
      if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
        if (diffX < 0) {
          changeVerse(1); // Swipe left -> Next verse
        } else {
          changeVerse(-1); // Swipe right -> Previous verse
        }
      }
    }, { passive: true });

    // Initial state
    showState('placeholder');
  </script>
</body>
