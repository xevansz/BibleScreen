<!DOCTYPE html>
<html lang="te">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="బైబిలు">
  <title>Telugu Bible Slideshow</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #1c2230;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #c8a96e;
      --accent-hover: #dfbe7f;
      --verse-text: #ffffff;
      --ref-text: #c8a96e;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ── CONTROL PANEL ── */
    #panel {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      flex-shrink: 0;
      z-index: 10;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    #panel.hidden {
      display: none;
    }

    .panel-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .panel-row:last-child {
      margin-bottom: 0;
    }

    .panel-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      min-width: 40px;
    }

    select,
    input[type="number"] {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 9px 10px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      min-height: 44px;
    }

    select:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
    }

    #book-select {
      flex: 1;
    }

    #chapter-input,
    #verse-input {
      width: 60px;
      text-align: center;
    }

    .btn {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 10px 14px;
      min-height: 44px;
      transition: background 0.15s, opacity 0.15s;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:active {
      opacity: 0.7;
    }

    .btn-primary {
      background: var(--accent);
      color: #0d1117;
      font-weight: 600;
    }

    .btn-secondary {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .font-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .font-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 18px;
      width: 40px;
      height: 40px;
      min-width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .font-btn:active {
      opacity: 0.6;
    }

    #font-size-label {
      font-size: 12px;
      color: var(--text-dim);
      min-width: 30px;
      text-align: center;
    }

    /* ── SLIDE AREA ── */
    #slide {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 80px;
      /* bottom pad for floating nav bar */
      position: relative;
      overflow: hidden;
      background: var(--bg);
      min-height: 0;
    }

    /* Verse display */
    #verse-reference {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--ref-text);
      letter-spacing: 0.06em;
      margin-bottom: 20px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(8px);
    }

    #verse-text {
      font-family: 'Noto Sans Telugu', sans-serif;
      font-size: 36px;
      font-weight: 600;
      color: var(--verse-text);
      line-height: 1.6;
      text-align: center;
      max-width: 100%;
      word-break: break-word;
      opacity: 0;
      transition: opacity 0.3s ease 0.05s, transform 0.3s ease 0.05s;
      transform: translateY(8px);
    }

    #verse-reference.show,
    #verse-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* States */
    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--text-dim);
      text-align: center;
    }

    #placeholder svg {
      opacity: 0.3;
    }

    #placeholder p {
      font-size: 15px;
      line-height: 1.6;
    }

    #loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--text-dim);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #error-msg {
      display: none;
      color: #f97583;
      font-size: 14px;
      text-align: center;
      padding: 0 20px;
      max-width: 420px;
      line-height: 1.6;
    }

    /* ── FLOATING BOTTOM NAV BAR (presentation mode) ── */
    /* Shown when controls are hidden */
    #float-nav {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      /* shown when panel hidden */
      align-items: center;
      gap: 0;
      background: rgba(22, 27, 34, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      padding: 6px 8px;
      backdrop-filter: blur(12px);
      z-index: 20;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .fnav-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 22px;
      width: 48px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 40px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.15s, color 0.15s;
    }

    .fnav-btn:active {
      background: rgba(200, 169, 110, 0.2);
      color: var(--accent);
    }

    #fnav-ref {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-dim);
      padding: 0 10px;
      white-space: nowrap;
      min-width: 80px;
      text-align: center;
    }

    .fnav-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    /* Controls toggle button in float nav */
    #fnav-controls {
      font-size: 14px;
      color: var(--accent);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      margin-left: 4px;
      padding-left: 4px;
      border-radius: 0 40px 40px 0;
    }

    /* Offline badge */
    #offline-badge {
      display: none;
      position: absolute;
      top: 12px;
      left: 14px;
      background: rgba(249, 117, 131, 0.15);
      border: 1px solid rgba(249, 117, 131, 0.35);
      color: #f97583;
      font-size: 11px;
      border-radius: 6px;
      padding: 4px 10px;
      z-index: 20;
    }

    /* Install prompt banner */
    #install-banner {
      display: none;
      background: rgba(200, 169, 110, 0.12);
      border-top: 1px solid rgba(200, 169, 110, 0.25);
      padding: 10px 16px;
      flex-shrink: 0;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-dim);
    }

    #install-banner button {
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 36px;
    }

    #install-banner .dismiss {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      margin-left: auto;
    }

    #install-banner .install-go {
      margin-left: 0;
    }

    /* History pills */
    #history {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #history::-webkit-scrollbar {
      display: none;
    }

    .hist-pill {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 12px;
      padding: 5px 12px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      min-height: 32px;
      display: flex;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .hist-pill:active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .section-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    /* Desktop keyboard hint */
    #keyboard-hint {
      position: absolute;
      bottom: 10px;
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0.3;
      pointer-events: none;
      letter-spacing: 0.04em;
      text-align: center;
    }

    @media (max-width: 600px) {
      #keyboard-hint {
        display: none;
      }
    }

    /* Tap hint — fades out after first use */
    #tap-hint {
      position: absolute;
      bottom: 90px;
      font-size: 12px;
      color: var(--text-dim);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transition: opacity 0.5s;
      letter-spacing: 0.03em;
    }

    #tap-hint.show {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <!-- CONTROL PANEL -->
  <div id="panel">
    <div class="panel-row">
      <span class="panel-label">Book</span>
      <select id="book-select"></select>
      <button class="btn btn-secondary" id="fullscreen-btn" title="Fullscreen (F)"
        style="padding:9px 12px;font-size:16px;min-width:44px;">⛶</button>
      <button class="btn btn-secondary" id="hide-controls-btn" title="Hide controls (C)"
        style="padding:9px 12px;font-size:15px;min-width:44px;">✕</button>
    </div>
    <div class="panel-row">
      <span class="panel-label">Ch / Vs</span>
      <input type="number" id="chapter-input" min="1" value="1" placeholder="Ch">
      <span style="color:var(--text-dim);">/</span>
      <input type="number" id="verse-input" min="1" value="1" placeholder="Vs">
      <button class="btn btn-secondary" id="prev-btn" style="padding:9px 12px;font-size:18px;min-width:44px;">‹</button>
      <button class="btn btn-primary" id="fetch-btn">Show</button>
      <button class="btn btn-secondary" id="next-btn" style="padding:9px 12px;font-size:18px;min-width:44px;">›</button>
    </div>
    <div class="panel-row" style="justify-content:space-between;">
      <div>
        <div class="section-label">Font</div>
        <div class="font-controls">
          <div class="font-btn" id="font-dec">−</div>
          <span id="font-size-label">36</span>
          <div class="font-btn" id="font-inc">+</div>
        </div>
      </div>
      <div style="flex:1;margin-left:12px;min-width:0;">
        <div class="section-label">Recent</div>
        <div id="history"></div>
      </div>
    </div>
  </div>

  <!-- SLIDE -->
  <div id="slide">
    <div id="offline-badge">● Offline</div>

    <div id="placeholder">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
      </svg>
      <p>పుస్తకం, అధ్యాయం &amp; వచనం ఎంచుకోండి<br>
        <span style="color:var(--text-dim);font-size:13px;">(Select book, chapter &amp; verse — then tap Show)</span>
      </p>
    </div>
    <div id="loading">
      <div class="spinner"></div>
      <span style="font-size:13px;">వచనం లోడ్ అవుతోంది…</span>
    </div>
    <div id="error-msg"></div>
    <div id="verse-reference"></div>
    <div id="verse-text"></div>

    <div id="tap-hint">Tap to show controls • Swipe to navigate</div>
    <div id="keyboard-hint">← → Navigate &bull; F Fullscreen &bull; C Controls</div>

    <!-- Floating nav bar (presentation mode) -->
    <div id="float-nav">
      <button class="fnav-btn" id="fnav-prev" title="Previous verse">‹</button>
      <span id="fnav-ref">—</span>
      <button class="fnav-btn" id="fnav-next" title="Next verse">›</button>
      <button class="fnav-btn" id="fnav-controls" title="Show controls">☰</button>
    </div>
  </div>

  <!-- INSTALL BANNER -->
  <div id="install-banner">
    <span>📖 Install for fullscreen &amp; offline</span>
    <button class="dismiss" id="install-dismiss">✕</button>
    <button class="install-go" id="install-btn">Install</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => { });
    }

    // Offline
    function updateOnlineStatus() {
      document.getElementById('offline-badge').style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // PWA install
    let deferredPrompt = null;
    const installBanner = document.getElementById('install-banner');
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      if (!sessionStorage.getItem('install-dismissed')) installBanner.style.display = 'flex';
    });
    document.getElementById('install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBanner.style.display = 'none';
    });
    document.getElementById('install-dismiss').addEventListener('click', () => {
      installBanner.style.display = 'none';
      sessionStorage.setItem('install-dismissed', '1');
    });

      { id: "JAS", name: "యాకోబు", eng: "James" },
      { id: "1PE", name: "1 పేతురు", eng: "1 Peter" },
      { id: "2PE", name: "2 పేతురు", eng: "2 Peter" },
      { id: "1JN", name: "1 యోహాను", eng: "1 John" },
      { id: "2JN", name: "2 యోహాను", eng: "2 John" },
      { id: "3JN", name: "3 యోహాను", eng: "3 John" },
      { id: "JUD", name: "యూదా", eng: "Jude" },
      { id: "REV", name: "ప్రకటన", eng: "Revelation" },
    ];

    const bookCache = new Map();
    let fontSize = parseInt(localStorage.getItem('te-bible-font')) || 36;
    let history = [];
    let panelVisible = true;
    let tapHintShown = false;

    // DOM refs
    const bookSelect = document.getElementById('book-select');
    const chapterInput = document.getElementById('chapter-input');
    const verseInput = document.getElementById('verse-input');
    const fetchBtn = document.getElementById('fetch-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const hideCtrlBtn = document.getElementById('hide-controls-btn');
    const verseRef = document.getElementById('verse-reference');
    const verseText = document.getElementById('verse-text');
    const placeholder = document.getElementById('placeholder');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error-msg');
    const fontLabel = document.getElementById('font-size-label');
    const historyEl = document.getElementById('history');
    const panel = document.getElementById('panel');
    const floatNav = document.getElementById('float-nav');
    const fnавRef = document.getElementById('fnav-ref');
    const tapHint = document.getElementById('tap-hint');

    // Populate books
    BOOKS.forEach((b, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${b.name} (${b.eng})`;
      bookSelect.appendChild(opt);
    });
    bookSelect.value = BOOKS.findIndex(b => b.id === 'MAT');

    // Font size
    function updateFontSize(n) {
      fontSize = Math.min(84, Math.max(18, n));
      fontLabel.textContent = fontSize;
      verseText.style.fontSize = fontSize + 'px';
      localStorage.setItem('te-bible-font', fontSize);
    }
    updateFontSize(fontSize);
    document.getElementById('font-dec').addEventListener('click', () => updateFontSize(fontSize - 2));
    document.getElementById('font-inc').addEventListener('click', () => updateFontSize(fontSize + 2));

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => { });
      } else {
        document.exitFullscreen().catch(() => { });
      }
    }
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Panel visibility
    function setPanelVisibility(v) {
      panelVisible = v;
      panel.classList.toggle('hidden', !v);
      floatNav.style.display = v ? 'none' : 'flex';

      // Show tap hint once when controls first hidden
      if (!v && !tapHintShown) {
        tapHintShown = true;
        tapHint.classList.add('show');
        setTimeout(() => tapHint.classList.remove('show'), 3000);
      }
    }

    // ✕ button in panel hides controls
    hideCtrlBtn.addEventListener('click', () => setPanelVisibility(false));
    // ☰ button in float nav shows controls
    document.getElementById('fnav-controls').addEventListener('click', () => setPanelVisibility(true));
    // Tap anywhere on slide toggles controls
    document.getElementById('slide').addEventListener('click', e => {
      if (e.target.closest('#float-nav')) return;
      setPanelVisibility(!panelVisible);
    });

    // Float nav prev/next
    document.getElementById('fnav-prev').addEventListener('click', e => { e.stopPropagation(); changeVerse(-1); });
    document.getElementById('fnav-next').addEventListener('click', e => { e.stopPropagation(); changeVerse(1); });

    // Update float nav reference label
    function updateFloatRef() {
      const bookIdx = parseInt(bookSelect.value);
      const book = BOOKS[bookIdx];
      const ch = parseInt(chapterInput.value) || 1;
      const vs = parseInt(verseInput.value) || 1;
      document.getElementById('fnav-ref').textContent = `${book.name} ${ch}:${vs}`;
    }

    // History
    function addHistory(label, bookIdx, ch, vs) {
      history = history.filter(h => h.label !== label);
      history.unshift({ label, bookIdx, ch, vs });
      if (history.length > 8) history.pop();
      historyEl.innerHTML = '';
      history.forEach(h => {
        const pill = document.createElement('div');
        pill.className = 'hist-pill';
        pill.textContent = h.label;
        pill.addEventListener('click', () => {
          bookSelect.value = h.bookIdx;
          chapterInput.value = h.ch;
          verseInput.value = h.vs;
          fetchVerse();
        });
        historyEl.appendChild(pill);
      });
    }

    // State
    function showState(state) {
      placeholder.style.display = 'none';
      loadingEl.style.display = 'none';
      errorEl.style.display = 'none';
      verseRef.classList.remove('show');
      verseText.classList.remove('show');
      if (state === 'placeholder') placeholder.style.display = 'flex';
      if (state === 'loading') loadingEl.style.display = 'flex';
      if (state === 'error') errorEl.style.display = 'block';
      if (state === 'verse') requestAnimationFrame(() => {
        verseRef.classList.add('show');
        verseText.classList.add('show');
      });
    }

    // Load book data
    async function loadBookData(fileName) {
      if (bookCache.has(fileName)) return bookCache.get(fileName);
      const primary = `https://raw.githubusercontent.com/aruljohn/Bible-telugu/main/${encodeURIComponent(fileName)}.json`;
      const fallback = `https://cdn.jsdelivr.net/gh/aruljohn/Bible-telugu@main/${encodeURIComponent(fileName)}.json`;
      let resp;
      try { resp = await fetch(primary); if (!resp.ok) throw new Error(); } catch { resp = await fetch(fallback); }
      if (!resp?.ok) throw new Error(`Failed to load ${fileName}`);
      const data = await resp.json();
      bookCache.set(fileName, data);
      return data;
    }

    // Fetch verse
    async function fetchVerse() {
      const bookIdx = parseInt(bookSelect.value);
      const book = BOOKS[bookIdx];
      const ch = parseInt(chapterInput.value) || 1;
      const vs = parseInt(verseInput.value) || 1;

      showState('loading');
      fetchBtn.disabled = true;

      try {
        const data = await loadBookData(book.file || book.eng);
        chapterInput.max = data.chapters.length;
        const chapterObj = data.chapters.find(c => String(c.chapter) === String(ch));
        if (!chapterObj) throw new Error(`అధ్యాయం ${ch} లేదు. (మొత్తం: ${data.chapters.length})`);
        verseInput.max = chapterObj.verses.length;
        const verseObj = chapterObj.verses.find(v => String(v.verse) === String(vs));
        if (!verseObj?.text) throw new Error(`వచనం ${vs} లేదు. (మొత్తం: ${chapterObj.verses.length})`);

        verseRef.textContent = `${data.book?.telugu || book.name} ${ch}:${vs}`;
        verseText.textContent = verseObj.text.trim();
        verseText.style.fontSize = fontSize + 'px';
        showState('verse');
        addHistory(`${book.name} ${ch}:${vs}`, bookIdx, ch, vs);
        updateFloatRef();
      } catch (err) {
        errorEl.textContent = err.message || 'వచనం కనుగొనబడలేదు. మళ్ళీ ప్రయత్నించండి.';
        showState('error');
      } finally {
        fetchBtn.disabled = false;
      }
    }

    // Navigate
    async function changeVerse(delta) {
      let bookIdx = parseInt(bookSelect.value);
      let ch = parseInt(chapterInput.value) || 1;
      let vs = parseInt(verseInput.value) || 1;
      const book = BOOKS[bookIdx];
      try {
        const data = await loadBookData(book.file || book.eng);
        const chapterObj = data.chapters.find(c => String(c.chapter) === String(ch));
        const totalVerses = chapterObj?.verses.length || 1;
        const totalChapters = data.chapters.length;
        if (delta > 0) {
          if (vs < totalVerses) { vs++; }
          else if (ch < totalChapters) { ch++; vs = 1; }
          else if (bookIdx < BOOKS.length - 1) { bookIdx++; ch = 1; vs = 1; }
          else return;
        } else {
          if (vs > 1) { vs--; }
          else if (ch > 1) {
            ch--;
            const prevChap = data.chapters.find(c => String(c.chapter) === String(ch));
            vs = prevChap?.verses.length || 1;
          } else if (bookIdx > 0) {
            bookIdx--;
            const prevBook = BOOKS[bookIdx];
            const prevData = await loadBookData(prevBook.file || prevBook.eng);
            ch = prevData.chapters.length;
            vs = prevData.chapters[ch - 1]?.verses.length || 1;
          } else return;
        }
        bookSelect.value = bookIdx;
        chapterInput.value = ch;
        verseInput.value = vs;
        await fetchVerse();
      } catch (err) { console.error(err); }
    }

    // Event listeners
    fetchBtn.addEventListener('click', fetchVerse);
    prevBtn.addEventListener('click', () => changeVerse(-1));
    nextBtn.addEventListener('click', () => changeVerse(1));

    bookSelect.addEventListener('change', async () => {
      chapterInput.value = 1; verseInput.value = 1;
      const book = BOOKS[parseInt(bookSelect.value)];
      try {
        const data = await loadBookData(book.file || book.eng);
        chapterInput.max = data.chapters.length;
        verseInput.max = data.chapters[0]?.verses.length || 1;
      } catch { }
    });

    chapterInput.addEventListener('change', async () => {
      const book = BOOKS[parseInt(bookSelect.value)];
      const ch = parseInt(chapterInput.value) || 1;
      try {
        const data = await loadBookData(book.file || book.eng);
        const chapterObj = data.chapters.find(c => String(c.chapter) === String(ch));
        if (chapterObj) verseInput.max = chapterObj.verses.length;
      } catch { }
    });

    [chapterInput, verseInput].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') fetchVerse(); });
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', e => {
      const tag = document.activeElement?.tagName;
      const inInput = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || (!inInput && e.code === 'Space')) {
        e.preventDefault(); changeVerse(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault(); changeVerse(-1);
      } else if (!inInput && (e.key === 'f' || e.key === 'F')) {
        e.preventDefault(); toggleFullscreen();
      } else if (!inInput && (e.key === 'c' || e.key === 'C')) {
        e.preventDefault(); setPanelVisibility(!panelVisible);
      } else if (e.key === 'Escape') {
        setPanelVisibility(true);
      }
    });

    // Swipe gestures
    let tx = 0, ty = 0;
    const slideEl = document.getElementById('slide');
    slideEl.addEventListener('touchstart', e => {
      tx = e.changedTouches[0].screenX;
      ty = e.changedTouches[0].screenY;
    }, { passive: true });
    slideEl.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - tx;
      const dy = e.changedTouches[0].screenY - ty;
      // Only swipe if moved enough and more horizontal than vertical
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) {
        dx < 0 ? changeVerse(1) : changeVerse(-1);
      }
    }, { passive: true });

    showState('placeholder');
  </script>
</body>

</html>
